name: Release workflow

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      DB_DATABASE: test_db
      DB_DATABASE_UNIT: unit_db
      DB_USER: test
      DB_PASSWORD: test
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v6

      - name: check if version is set
        run:  grep -q "define('ITSM_VERSION', '${TAG#v}');" inc/define.php && echo "Version correspondante" || { echo "La version dans inc/define.php n'est pas bonne"; exit 5; }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, sqlsrv, pdo_sqlsrv
          coverage: none

      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run composer install
        run: export NODE_OPTIONS=--openssl-legacy-provider && php bin/console dependencies install

      - name: Set up MariaDB
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y --no-auto-remove \
            mysql-server mysql-server-core mysql-client mysql-client-core mysql-common
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-auto-remove mariadb-server
          sudo systemctl start mariadb

          php --ri gd

          sudo mariadb <<SQL
          CREATE DATABASE IF NOT EXISTS \`${DB_DATABASE}\`;
          CREATE USER IF NOT EXISTS '${DB_USER}'@'localhost' IDENTIFIED BY '${DB_PASSWORD}';
          GRANT ALL PRIVILEGES ON \`${DB_DATABASE}\`.* TO '${DB_USER}'@'localhost';
          SQL

      - name: Install ITSM-ng
        run: php bin/console itsmng:database:install -H localhost -u $DB_USER -p $DB_PASSWORD -d $DB_DATABASE -n

      - name: Setup migration environment
        run: |
          sudo mariadb -e "CREATE DATABASE IF NOT EXISTS itsm_migration;"
          sudo mariadb -e "CREATE USER IF NOT EXISTS 'itsm_migration'@'localhost' IDENTIFIED BY 'itsm_migration';"
          sudo mariadb -e "GRANT ALL PRIVILEGES ON itsm_migration.* TO 'itsm_migration'@'localhost';"
          sudo mariadb -e "FLUSH PRIVILEGES;"
          sudo mariadb -u itsm_migration -pitsm_migration itsm_migration < tests/migrations/schema.sql

      - name: Run migration tests
        run: php bin/console itsmng:database:update --config-dir=/home/runner/work/itsm-ng/itsm-ng/tests/migrations -n

      - name: Clean environment
        run: |
          rm -f config/config_db.php config/glpicrypt.key files/_log/*.log

      - name: Release ITSM-ng
        run: |
          sudo apt install gettext -y
          cd tools/
          # Remove the 'v' prefix from the tag
          export TAG=$(sed -e 's/^v//' <<< $TAG)
          export NODE_OPTIONS=--openssl-legacy-provider
          ./make_release.sh -y ../ $TAG
          mv /tmp/itsm-ng-${TAG}.tgz /tmp/itsm-ng-v${TAG}.tgz

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: itsm-ng-${{ github.ref_name }}.tgz
          path: /tmp/itsm-ng-${{ github.ref_name }}.tgz

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: /tmp/itsm-ng-${{ github.ref_name }}.tgz
          body: "New release is available"
          name: ITSM-NG ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
